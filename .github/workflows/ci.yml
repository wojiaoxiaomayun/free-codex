name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 打包为解包目录（不产出签名安装包）：验证 electron-builder 配置与 asar 打包链路
      - name: Package (dir)
        run: npm run dist:dir

      - name: Upload unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: release/win-unpacked
          if-no-files-found: error
